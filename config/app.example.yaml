# =============================================================================
# 应用配置样本
#
# 使用方法：
#   1. 复制本文件为同目录下的 app.yaml
#      Windows:  copy config\app.example.yaml config\app.yaml
#      Linux/macOS: cp config/app.example.yaml config/app.yaml
#   2. 按本机环境修改 app.yaml（代理地址等，勿把含私密信息的 app.yaml 公开）
#   3. 修改后需重启 MCP 进程
#
# 说明：
# - proxy：出站代理（Yahoo / CNBC / RSS / 鉅亨網 / 正文抓取 / 行情）
# =============================================================================

proxy:
  # 是否启用出站代理
  enabled: false
  # 代理主机
  host: 127.0.0.1
  # 代理端口（QuickQ 常见为 8800；Clash 常见为 7890）
  port: 8800
