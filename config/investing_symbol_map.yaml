# Yahoo 正规报价符号 → Investing.com（investpy / investingpy）映射
# 用于 /api/market/history/investing
# 字段说明：
#   product: stocks | indices | cryptos | commodities | bonds | etfs
#   investing_name: 传给 investpy get_*_historical_data 的名称参数
#   investing_symbol: Investing 侧符号（便于排查）
#   country: 股票/指数/ETF 等多数字段需要；加密货币可省略
#   investing_id / tag / exchange: 优先走 search 对象拉历史（更稳）
#   quote_type: 对齐 Yahoo HistoryResponse.quoteType
#   enabled: false 表示已知无可靠映射，调用时直接报错

